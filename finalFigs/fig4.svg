  <g fill="#1E40AF">
    <rect x="30" y="104" width="9" height="20" fill-opacity=".9"/><rect x="40" y="104" width="9" height="20" fill-opacity=".4"/><rect x="50" y="104" width="9" height="20" fill-opacity="1"/><rect x="60" y="104" width="9" height="20" fill-opacity=".3"/><rect x="70" y="104" width="9" height="20" fill-opacity=".7"/>
