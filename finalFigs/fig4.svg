  <rect width="1200" height="480" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="13" font-weight="700" fill="#0F172A">Traffic1DCNN Architecture, Layer Dimensions, and Temporal Receptive Field Propagation</text>

