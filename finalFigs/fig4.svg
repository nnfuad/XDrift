    <rect x="186" y="282" width="180" height="42" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="276" y="299" font-size="11" font-weight="700" fill="#1E40AF">RF = 6 packets</text><text x="276" y="313" font-size="9" fill="#64748B">temporal receptive field</text>
  </g>

