    <rect x="422" y="236" width="180" height="38" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text x="512" y="252" font-size="11" font-weight="700" fill="#92400E">MaxPool1D</text><text x="512" y="266" font-size="9" fill="#334155">kernel=2, stride=2</text>
    <rect x="422" y="282" width="180" height="42" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="512" y="299" font-size="11" font-weight="700" fill="#1E40AF">RF = 14 packets</text><text x="512" y="313" font-size="9" fill="#64748B">temporal receptive field</text>
  </g>

  <!-- ============ CONV BLOCK 3 ============ -->
  <rect x="648" y="56" width="200" height="278" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
