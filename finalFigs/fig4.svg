<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Traffic1DCNN Architecture, Layer Dimensions, and Temporal Receptive Field Propagation</title>
