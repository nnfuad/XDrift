    <rect x="30" y="128" width="9" height="20" fill-opacity=".3"/><rect x="40" y="128" width="9" height="20" fill-opacity=".5"/><rect x="50" y="128" width="9" height="20" fill-opacity=".2"/><rect x="60" y="128" width="9" height="20" fill-opacity=".7"/><rect x="70" y="128" width="9" height="20" fill-opacity=".4"/>
    <rect x="80" y="128" width="9" height="20" fill-opacity=".3"/><rect x="90" y="128" width="9" height="20" fill-opacity=".8"/><rect x="100" y="128" width="9" height="20" fill-opacity=".5"/><rect x="110" y="128" width="9" height="20" fill-opacity=".25"/><rect x="120" y="128" width="9" height="20" fill-opacity=".6"/>
  </g>
  <text x="80" y="172" font-size="10" font-weight="700" fill="#1E40AF" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">(Batch, 2, 64)</text>
