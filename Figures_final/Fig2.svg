  <text x="32" y="63" font-size="12" font-weight="700" fill="#FFFFFF">(a) Raw Telemetry Ingestion</text>

  <rect x="32" y="88" width="206" height="84" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="50" y="96" width="26" height="34" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <rect x="46" y="100" width="26" height="34" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <rect x="42" y="104" width="26" height="34" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <line x1="48" y1="114" x2="62" y2="114" stroke="#2563EB" stroke-width="1"/><line x1="48" y1="120" x2="62" y2="120" stroke="#2563EB" stroke-width="1"/><line x1="48" y1="126" x2="58" y2="126" stroke="#2563EB" stroke-width="1"/>
  <text x="84" y="118" font-size="12" font-weight="700" fill="#0F172A">140 Raw PCAP/PCAPNG</text>
  <text x="84" y="134" font-size="12" font-weight="700" fill="#0F172A">Captures</text>
  <text x="84" y="152" font-size="10" fill="#475569" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">(24.42 GiB)</text>

  <line x1="135" y1="172" x2="135" y2="188" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arB)"/>

  <rect x="32" y="192" width="206" height="72" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="42" y="207" font-size="10" font-weight="700" fill="#0F172A">Application categories</text>
  <g font-size="10" fill="#1E3A8A" text-anchor="middle">
    <rect x="42" y="214" width="62" height="18" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="73" y="227">Streaming</text>
    <rect x="110" y="214" width="42" height="18" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="131" y="227">VoIP</text>
    <rect x="158" y="214" width="42" height="18" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="179" y="227">Chat</text>
    <rect x="42" y="238" width="60" height="18" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="72" y="251">Torrents</text>
