  <line x1="135" y1="264" x2="135" y2="280" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arB)"/>

  <rect x="32" y="284" width="206" height="170" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="42" y="301" font-size="10" font-weight="700" fill="#0F172A">Inactivity segmentation</text>
  <text x="138" y="324" font-size="10" fill="#475569" text-anchor="middle">gap &gt; timeout</text>
