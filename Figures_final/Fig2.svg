  <text x="135" y="421" font-size="10" fill="#0F172A" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">Δt_timeout = 120.0 s</text>

  <line x1="252" y1="268" x2="268" y2="268" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arB)"/>

  <!-- ================= PANEL (b) ================= -->
  <rect x="270" y="44" width="240" height="448" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
  <rect x="270" y="44" width="240" height="28" rx="8" fill="#0F172A"/><rect x="270" y="58" width="240" height="14" fill="#0F172A"/>
  <text x="282" y="63" font-size="12" font-weight="700" fill="#FFFFFF">(b) Flow Canonicalization</text>

  <text x="282" y="90" font-size="10" font-weight="700" fill="#0F172A">Lexicographical key · Equation (1)</text>
  <rect x="282" y="96" width="216" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
  <g font-size="10" fill="#0F172A" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">
    <text x="292" y="116">FlowKey = (min_lex(E_1, E_2),</text>
    <text x="358" y="132">max_lex(E_1, E_2),</text>
    <text x="358" y="148">protocol)</text>
  </g>

  <rect x="282" y="176" width="216" height="88" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="292" y="190" width="62" height="34" rx="4" fill="#EFF6FF" stroke="#0F172A" stroke-width="1.2"/>
  <rect x="426" y="190" width="62" height="34" rx="4" fill="#EFF6FF" stroke="#0F172A" stroke-width="1.2"/>
  <text x="323" y="211" font-size="10" fill="#0F172A" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">E_src</text>
  <text x="457" y="211" font-size="10" fill="#0F172A" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">E_dst</text>
  <line x1="356" y1="199" x2="422" y2="199" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arB)"/>
  <line x1="424" y1="216" x2="358" y2="216" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arB)"/>
  <text x="389" y="194" font-size="10" fill="#1E3A8A" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">d_t=+1</text>
  <text x="389" y="233" font-size="10" fill="#1E3A8A" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">d_t=-1</text>
  <text x="390" y="254" font-size="10" fill="#475569" text-anchor="middle">both directions → one canonical key</text>

  <text x="282" y="282" font-size="10" font-weight="700" fill="#0F172A">Direction indicator</text>
  <rect x="282" y="288" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
  <g font-size="10" fill="#0F172A" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">
    <text x="292" y="308">d_t = +1 if E_src &lt;= E_dst</text>
    <text x="292" y="324">      else -1</text>
  </g>

  <line x1="390" y1="338" x2="390" y2="364" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arB)"/>
  <rect x="282" y="368" width="216" height="84" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="390" y="400" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">339,009</text>
  <text x="390" y="420" font-size="10" fill="#0F172A" text-anchor="middle">Bidirectional Flows</text>
  <text x="390" y="434" font-size="10" fill="#0F172A" text-anchor="middle">Reassembled</text>

  <line x1="512" y1="268" x2="528" y2="268" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arB)"/>

  <!-- ================= PANEL (c) ================= -->
  <rect x="530" y="44" width="400" height="448" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
  <rect x="530" y="44" width="400" height="28" rx="8" fill="#0F172A"/><rect x="530" y="58" width="400" height="14" fill="#0F172A"/>
  <text x="542" y="63" font-size="12" font-weight="700" fill="#FFFFFF">(c) Split Protocol Comparison</text>

  <!-- flawed -->
  <rect x="542" y="82" width="376" height="178" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <path d="M893 94 L905 116 L881 116 Z" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="893" y1="100" x2="893" y2="108" stroke="#DC2626" stroke-width="1.6"/><circle cx="893" cy="112" r="1.1" fill="#DC2626"/>
  <text x="554" y="102" font-size="12" font-weight="700" fill="#DC2626">Flawed Naive Random Split</text>
  <text x="554" y="117" font-size="10" fill="#DC2626">(Cross-Split Contamination)</text>
  <rect x="554" y="128" width="352" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <g>
    <rect x="558" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="572.5" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="587" y="133" width="12.5" height="20" fill="#0F172A"/><rect x="601.5" y="133" width="12.5" height="20" fill="#2563EB"/>
    <rect x="616" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="630.5" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="645" y="133" width="12.5" height="20" fill="#0F172A"/><rect x="659.5" y="133" width="12.5" height="20" fill="#2563EB"/>
    <rect x="674" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="688.5" y="133" width="12.5" height="20" fill="#0F172A"/><rect x="703" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="717.5" y="133" width="12.5" height="20" fill="#2563EB"/>
    <rect x="732" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="746.5" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="761" y="133" width="12.5" height="20" fill="#0F172A"/><rect x="775.5" y="133" width="12.5" height="20" fill="#2563EB"/>
    <rect x="790" y="133" width="12.5" height="20" fill="#0F172A"/><rect x="804.5" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="819" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="833.5" y="133" width="12.5" height="20" fill="#2563EB"/>
    <rect x="848" y="133" width="12.5" height="20" fill="#0F172A"/><rect x="862.5" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="877" y="133" width="12.5" height="20" fill="#2563EB"/><rect x="891.5" y="133" width="12.5" height="20" fill="#0F172A"/>
  </g>
  <text x="554" y="174" font-size="10" fill="#475569">Same capture, flows assigned at random</text>
  <rect x="800" y="166" width="9" height="9" fill="#2563EB"/><text x="813" y="174" font-size="10" fill="#475569">Train</text>
  <rect x="852" y="166" width="9" height="9" fill="#0F172A"/><text x="865" y="174" font-size="10" fill="#475569">Test</text>
  <g font-size="10" fill="#0F172A">
    <text x="554" y="198">• Flows from identical PCAP partitioned randomly</text>
    <text x="561" y="212">into Train &amp; Test.</text>
    <text x="554" y="230">• Shared TCP/IP stack, ephemeral ports, cipher suites</text>
    <text x="561" y="246" font-weight="700" fill="#DC2626">→ Memorization &amp; inflated F1 (&gt;95%)</text>
  </g>

  <text x="730" y="274" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">vs.</text>

  <!-- leakage-free -->
  <rect x="542" y="282" width="376" height="200" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="554" y="301" font-size="12" font-weight="700" fill="#059669">Leakage-Free Canonical Session Partitioning (Ours)</text>
  <text x="554" y="318" font-size="10" fill="#0F172A">106 Canonical Session Groups partitioned strictly</text>
  <text x="554" y="331" font-size="10" fill="#0F172A">at the capture boundary:</text>
  <rect x="554" y="340" width="245.7" height="26" fill="#2563EB"/>
  <rect x="799.7" y="340" width="53.1" height="26" fill="#64748B"/>
  <rect x="852.8" y="340" width="53.2" height="26" fill="#059669"/>
  <g font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="676" y="357">Train · 74</text><text x="826" y="357">16</text><text x="879" y="357">16</text>
  </g>
  <g font-size="10" fill="#0F172A">
    <rect x="556" y="378" width="9" height="9" fill="#2563EB"/><text x="570" y="387">Train: 74 sessions (220,194 flows)</text>
    <rect x="556" y="396" width="9" height="9" fill="#64748B"/><text x="570" y="405">Validation: 16 sessions (69,564 flows)</text>
    <rect x="556" y="414" width="9" height="9" fill="#059669"/><text x="570" y="423">Test: 16 sessions (49,251 flows)</text>
    <text x="570" y="437" fill="#475569">2,693 VPN minority vs 46,558 Non-VPN; 17.29:1 ratio</text>
  </g>
  <rect x="554" y="450" width="352" height="22" rx="4" fill="#059669"/>
  <path d="M566 461 L570 465 L577 456" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="586" y="465" font-size="10" font-weight="700" fill="#FFFFFF">Zero session contamination across splits</text>

  <line x1="932" y1="268" x2="948" y2="268" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arB)"/>

  <!-- ================= PANEL (d) ================= -->
  <rect x="950" y="44" width="230" height="448" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
  <rect x="950" y="44" width="230" height="28" rx="8" fill="#0F172A"/><rect x="950" y="58" width="230" height="14" fill="#0F172A"/>
  <text x="962" y="63" font-size="12" font-weight="700" fill="#FFFFFF">(d) Featurization &amp; Masking</text>

  <text x="1065" y="90" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">(2, 64) Numerical Tensor</text>
  <g fill="#2563EB">
    <rect x="969" y="98" width="11" height="14" fill-opacity=".9"/><rect x="981" y="98" width="11" height="14" fill-opacity=".5"/><rect x="993" y="98" width="11" height="14" fill-opacity=".8"/><rect x="1005" y="98" width="11" height="14" fill-opacity=".3"/>
    <rect x="1017" y="98" width="11" height="14" fill-opacity=".7"/><rect x="1029" y="98" width="11" height="14" fill-opacity=".95"/><rect x="1041" y="98" width="11" height="14" fill-opacity=".4"/><rect x="1053" y="98" width="11" height="14" fill-opacity=".6"/>
    <rect x="1065" y="98" width="11" height="14" fill-opacity=".85"/><rect x="1077" y="98" width="11" height="14" fill-opacity=".35"/><rect x="1089" y="98" width="11" height="14" fill-opacity=".75"/><rect x="1101" y="98" width="11" height="14" fill-opacity=".5"/>
    <rect x="1113" y="98" width="11" height="14" fill-opacity=".9"/><rect x="1125" y="98" width="11" height="14" fill-opacity=".3"/><rect x="1137" y="98" width="11" height="14" fill-opacity=".6"/><rect x="1149" y="98" width="11" height="14" fill-opacity=".8"/>
    <rect x="969" y="114" width="11" height="14" fill-opacity=".2"/><rect x="981" y="114" width="11" height="14" fill-opacity=".4"/><rect x="993" y="114" width="11" height="14" fill-opacity=".3"/><rect x="1005" y="114" width="11" height="14" fill-opacity=".5"/>
    <rect x="1017" y="114" width="11" height="14" fill-opacity=".6"/><rect x="1029" y="114" width="11" height="14" fill-opacity=".2"/><rect x="1041" y="114" width="11" height="14" fill-opacity=".7"/><rect x="1053" y="114" width="11" height="14" fill-opacity=".3"/>
    <rect x="1065" y="114" width="11" height="14" fill-opacity=".5"/><rect x="1077" y="114" width="11" height="14" fill-opacity=".4"/><rect x="1089" y="114" width="11" height="14" fill-opacity=".8"/><rect x="1101" y="114" width="11" height="14" fill-opacity=".3"/>
    <rect x="1113" y="114" width="11" height="14" fill-opacity=".5"/><rect x="1125" y="114" width="11" height="14" fill-opacity=".6"/><rect x="1137" y="114" width="11" height="14" fill-opacity=".2"/><rect x="1149" y="114" width="11" height="14" fill-opacity=".4"/>
  </g>
  <text x="1065" y="145" font-size="10" fill="#475569" text-anchor="middle">2 channels × 64 time steps</text>

  <rect x="962" y="154" width="206" height="84" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="972" y="170" font-size="10" font-weight="700" fill="#1E3A8A">Channel 0 · signed length</text>
  <g font-size="10" fill="#0F172A" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">
    <text x="972" y="188">X_{0,t} = d_t * min(1.0,</text>
    <text x="1032" y="203">length_t / 1500)</text>
    <text x="972" y="222">in [-1, +1]</text>
  </g>

  <rect x="962" y="246" width="206" height="84" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="972" y="262" font-size="10" font-weight="700" fill="#1E3A8A">Channel 1 · log inter-arrival</text>
  <g font-size="10" fill="#0F172A" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">
    <text x="972" y="280">X_{1,t} = ln(1 + min(</text>
    <text x="1032" y="295">Δt_t, 5.0)) / ln(6.0)</text>
    <text x="972" y="314">in [0, 1]</text>
  </g>

  <rect x="962" y="340" width="206" height="142" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="972" y="356" font-size="10" font-weight="700" fill="#1E3A8A">Observational mask</text>
  <g font-size="10" fill="#0F172A" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">
    <text x="972" y="373">m_t = 1 for t &lt; L</text>
    <text x="972" y="388">m_t = 0 for t &gt;= L</text>
  </g>
  <text x="1090" y="406" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,monospace">L</text>
  <rect x="970" y="410" width="120" height="18" fill="#2563EB"/>
  <rect x="1090" y="410" width="72" height="18" fill="url(#hatch)" stroke="#94A3B8" stroke-width="1"/>
  <line x1="1090" y1="408" x2="1090" y2="430" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="3 2"/>
  <text x="1030" y="444" font-size="10" fill="#475569" text-anchor="middle">observed</text>
  <text x="1126" y="444" font-size="10" fill="#475569" text-anchor="middle">padding</text>
  <text x="1065" y="468" font-size="10" fill="#475569" text-anchor="middle">zero padding strictly masked</text>

  <!-- legend -->
  <g font-size="10" fill="#0F172A">
    <rect x="20" y="504" width="10" height="10" fill="#2563EB"/><text x="35" y="513">Valid processing stage / forward path</text>
    <rect x="260" y="504" width="10" height="10" fill="#DC2626"/><text x="275" y="513">Flawed protocol</text>
    <rect x="390" y="504" width="10" height="10" fill="#059669"/><text x="405" y="513">Leakage-free (proposed)</text>
  </g>
