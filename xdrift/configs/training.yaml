optimizer:
  name: "AdamW"
  lr: 0.001
  weight_decay: 0.0001

training:
  batch_size: 64
  max_epochs: 50
  early_stopping_patience: 10
  early_stopping_metric: "val_loss"
  use_class_weights: true
  seeds: [42, 123, 456, 789, 1011]
  device: "cpu"  # Quantization evaluated on CPU (qnnpack)

checkpoints_dir: "artifacts/checkpoints"
