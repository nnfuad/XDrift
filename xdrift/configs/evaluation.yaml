metrics:
  - "accuracy"
  - "balanced_accuracy"
  - "precision"
  - "recall"
  - "f1_score"
  - "roc_auc"
  - "pr_auc"
  - "confusion_matrix"
  - "minority_recall"

threshold_selection:
  strategy: "validation_best_f1"
  default: 0.5

statistical_tests:
  bootstrap_iterations: 1000
  confidence_level: 0.95
  group_resampling: true

results_dir: "results/metrics"
